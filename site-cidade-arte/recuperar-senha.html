<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recuperar senha | Cidade da Arte</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="painel login-painel">


    <div class="login-box">


        <h1>
            Cidade da Arte
        </h1>


        <p>
            Recuperar senha
        </p>


        <p class="texto-ajuda">
            Digite o e-mail cadastrado. Vamos enviar um link para você criar uma senha nova.
        </p>



        <form id="formRecuperarSenha">


            <div class="form-grupo">

                <label>
                    E-mail
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>




            <button
                type="submit"
                class="btn-salvar"
            >

                Enviar link de recuperação

            </button>



        </form>



        <a href="login.html" class="link-esqueci-senha">
            Voltar para o login
        </a>



    </div>



</section>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="recuperar-senha.js"></script>



</body>

</html>
