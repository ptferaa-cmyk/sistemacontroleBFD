<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastrar Produto | Cidade da Arte</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="painel">


<h1>
Cadastrar Produto
</h1>



<form id="formProduto">



<div class="form-grupo">

<label>
Nome do Produto
</label>

<input id="nome" type="text" required>

</div>




<div class="form-grupo">

<label>
Categoria
</label>

<select id="categoria" required>


<option value="Quadros">
Quadros
</option>


<option value="Espelhos">
Espelhos
</option>


<option value="Molduras">
Molduras
</option>


</select>

</div>




<div class="form-grupo">

<label>
Preço
</label>

<input id="preco" type="number" step="0.01" required>

</div>




<div class="form-grupo">

<label>
Descrição
</label>

<textarea id="descricao"></textarea>

</div>




<div class="form-grupo">

<label>
Imagem
</label>

<input id="imagem" type="file" accept="image/*">

</div>




<div class="form-grupo">

<label>
Disponibilidade
</label>


<select id="disponibilidade">


<option value="Em estoque">
Em estoque
</option>


<option value="Sob encomenda">
Sob encomenda
</option>


<option value="Indisponível">
Indisponível
</option>


</select>


</div>




<button type="submit" class="btn-admin">

Cadastrar Produto

</button>



</form>



</section>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="cadastrar-produto.js"></script>


</body>

</html>
