<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quadros | Cidade da Arte</title>

    <meta name="description"
        content="Quadros decorativos da Cidade da Arte.">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="logo" aria-label="Cidade da Arte - página inicial">

                <img
                    src="logo-cidade-da-arte.png"
                    alt="Cidade da Arte"
                    class="logo-imagem"
                >

            </a>

            <a href="https://wa.me/557382082439"
                target="_blank"
                class="btn btn-header-whats">

                <span>
                    Fale no WhatsApp
                </span>

            </a>

        </div>

    </header>

    <!-- ================= HERO ================= -->

    <section class="catalogo-hero">

        <div class="hero-content">

            <p class="hero-eyebrow">

                Cidade da Arte

            </p>

            <h1 class="hero-title">

                Quadros

            </h1>

            <p class="hero-subtitle">

                Encontre quadros decorativos, personalizados e exclusivos para transformar qualquer ambiente.

            </p>

        </div>

    </section>

    <!-- ================= CATÁLOGO ================= -->

    <section class="catalogo">

        <div class="section-inner">

            <h2 class="section-title">

                Nossos Quadros

            </h2>

            <p class="section-subtitle">

                Escolha seu quadro e finalize a compra pelo WhatsApp.

            </p>

            <div
                id="filtrosTema"
                class="filtros-tema"
                role="group"
                aria-label="Filtrar por tema">

                <button type="button" class="filtro-tema filtro-tema-ativo" data-tema="Todos">Todos</button>
                <button type="button" class="filtro-tema" data-tema="Abstrato">Abstrato</button>
                <button type="button" class="filtro-tema" data-tema="Animais">Animais</button>
                <button type="button" class="filtro-tema" data-tema="Árvores">Árvores</button>
                <button type="button" class="filtro-tema" data-tema="Barcos">Barcos</button>
                <button type="button" class="filtro-tema" data-tema="Floral">Floral</button>
                <button type="button" class="filtro-tema" data-tema="Folhagens">Folhagens</button>
                <button type="button" class="filtro-tema" data-tema="Geométrico">Geométrico</button>
                <button type="button" class="filtro-tema" data-tema="Ilhéus e Região">Ilhéus e Região</button>
                <button type="button" class="filtro-tema" data-tema="Mar">Mar</button>
                <button type="button" class="filtro-tema" data-tema="Marmorizado">Marmorizado</button>
                <button type="button" class="filtro-tema" data-tema="Natureza">Natureza</button>
                <button type="button" class="filtro-tema" data-tema="Novidades">Novidades</button>
                <button type="button" class="filtro-tema" data-tema="Religioso">Religioso</button>

            </div>

            <div
                id="lista-produtos"
                class="cards-grid">

                <!--
                    Os produtos cadastrados no painel
                    aparecerão automaticamente aqui.
                -->

            </div>

        </div>

    </section>

    <!-- ================= RODAPÉ ================= -->

    <footer class="site-footer">

        <p class="footer-brand">

            Cidade da Arte

        </p>

        <p class="footer-copy">

            © 2026 Cidade da Arte. Todos os direitos reservados.

        </p>

        <a href="https://instagram.com/cidadedaarte.ios"
            target="_blank"
            class="footer-instagram">

            @cidadedaarte.ios

        </a>

    </footer>

    <!-- ================= SCRIPTS ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script>

        const categoriaPagina = "Quadros";

    </script>

    <script src="catalogo.js"></script>

</body>

</html>
