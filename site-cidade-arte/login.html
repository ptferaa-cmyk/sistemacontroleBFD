<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Cidade da Arte</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="painel login-painel">


    <div class="login-box">


        <h1>
            Cidade da Arte
        </h1>


        <p>
            Área administrativa
        </p>



        <form id="formLogin">


            <div class="form-grupo">

                <label>
                    E-mail
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>





            <div class="form-grupo">

                <label>
                    Senha
                </label>


                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>





            <button
                type="submit"
                class="btn-salvar"
            >

                Entrar

            </button>


            <a href="recuperar-senha.html" class="link-esqueci-senha">
                Esqueci minha senha
            </a>


        </form>



    </div>



</section>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="login.js"></script>



</body>

</html>
