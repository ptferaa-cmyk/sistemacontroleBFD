<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Produto | Cidade da Arte</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-protegida">

    <section class="painel editar-painel">

        <div class="painel-topo">

            <div>
                <h1>
                    Cadastrar Produto
                </h1>

                <p>
                    Preencha as informações do produto.
                </p>
            </div>

            <a href="admin.html" class="btn-voltar">
                Voltar
            </a>

        </div>

        <form id="formProduto" class="form-admin">

            <div class="form-grupo">
                <label for="nome">
                    Nome do produto
                </label>

                <input
                    id="nome"
                    type="text"
                    placeholder="Nome do produto"
                    required
                >
            </div>

            <div class="form-grupo">
                <label for="categoria">
                    Categoria
                </label>

                <select id="categoria" required>
                    <option value="Quadros">
                        Quadros
                    </option>

                    <option value="Espelhos">
                        Espelhos
                    </option>
                </select>
            </div>

            <div id="precoDuplo" class="form-linha">

                <div class="form-grupo">
                    <label for="precoQuadro">
                        Preço (Quadro)
                    </label>

                    <input
                        id="precoQuadro"
                        type="number"
                        step="0.01"
                        min="0.01"
                        placeholder="0,00"
                    >
                </div>

                <div class="form-grupo">
                    <label for="precoTela">
                        Preço (Tela)
                    </label>

                    <input
                        id="precoTela"
                        type="number"
                        step="0.01"
                        min="0.01"
                        placeholder="0,00"
                    >
                </div>

            </div>

            <div id="blocoTema" class="form-grupo">
                <label for="tema">
                    Tema
                </label>

                <select id="tema">
                    <option value="Abstrato">Abstrato</option>
                    <option value="Animais">Animais</option>
                    <option value="Árvores">Árvores</option>
                    <option value="Barcos">Barcos</option>
                    <option value="Floral">Floral</option>
                    <option value="Folhagens">Folhagens</option>
                    <option value="Geométrico">Geométrico</option>
                    <option value="Ilhéus e Região">Ilhéus e Região</option>
                    <option value="Mar">Mar</option>
                    <option value="Marmorizado">Marmorizado</option>
                    <option value="Natureza">Natureza</option>
                    <option value="Novidades">Novidades</option>
                    <option value="Religioso">Religioso</option>
                </select>
            </div>

            <div id="precoUnico" class="form-grupo oculto">
                <label for="preco">
                    Preço
                </label>

                <input
                    id="preco"
                    type="number"
                    step="0.01"
                    min="0.01"
                    placeholder="0,00"
                >
            </div>

            <div class="form-grupo">
                <label for="tamanho">
                    Tamanho
                </label>

                <input
                    id="tamanho"
                    type="text"
                    placeholder="Ex: 40x60cm"
                    required
                >
            </div>

            <div class="form-grupo">
                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    placeholder="Descrição do produto"
                ></textarea>
            </div>

            <div class="form-grupo">
                <label for="imagem">
                    Imagem
                </label>

                <input
                    id="imagem"
                    type="file"
                    accept="image/*"
                    required
                >
            </div>

            <div class="form-grupo">
                <label for="disponibilidade">
                    Disponibilidade
                </label>

                <select id="disponibilidade" required>
                    <option value="Em estoque">
                        Em estoque
                    </option>

                    <option value="Sob encomenda">
                        Sob encomenda
                    </option>

                    <option value="Indisponível">
                        Indisponível
                    </option>
                </select>
            </div>

            <button type="submit" class="btn-admin">
                Cadastrar Produto
            </button>

        </form>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="cadastrar-produto.js"></script>

</body>

</html>
