<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Produto | Cidade da Arte</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<section class="painel editar-painel">



    <div class="painel-topo">


        <div>

            <h1>
                Editar Produto
            </h1>


            <p>
                Atualize as informações do produto cadastrado.
            </p>

        </div>




        <a href="produtos-admin.html" class="btn-voltar">

            Voltar

        </a>



    </div>






    <form id="formEditarProduto" class="form-admin">





        <div class="form-grupo">

            <label for="nome">
                Nome do produto
            </label>


            <input
                type="text"
                id="nome"
                placeholder="Nome do produto"
                required
            >

        </div>






        <div class="form-linha">


            <div class="form-grupo">


                <label for="categoria">
                    Categoria
                </label>


                <select id="categoria">


                    <option value="Quadros">
                        Quadros
                    </option>


                    <option value="Molduras">
                        Molduras
                    </option>


                    <option value="Espelhos">
                        Espelhos
                    </option>



                </select>


            </div>







            <div class="form-grupo">


                <label for="preco">
                    Preço
                </label>


                <input

                    type="number"

                    id="preco"

                    step="0.01"

                    placeholder="0,00"

                >


            </div>



        </div>








        <div class="form-grupo">


            <label for="descricao">
                Descrição
            </label>


            <textarea

                id="descricao"

                placeholder="Descrição do produto"

            ></textarea>



        </div>








        <div class="form-grupo">


            <label for="disponibilidade">
                Disponibilidade
            </label>



            <select id="disponibilidade">


                <option value="Em estoque">
                    Em estoque
                </option>


                <option value="Sob encomenda">
                    Sob encomenda
                </option>


                <option value="Indisponível">
                    Indisponível
                </option>



            </select>



        </div>









        <div class="form-grupo">


            <label for="imagem">
                Alterar imagem
            </label>



            <input

                type="file"

                id="imagem"

                accept="image/*"

            >



        </div>








        <div class="acoes-produto">



            <button

                type="submit"

                class="btn-salvar"

            >

                Salvar alterações


            </button>





            <button

                type="button"

                id="btnExcluirProduto"

                class="btn-excluir"

            >

                Excluir produto


            </button>



        </div>






    </form>






</section>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>


<script src="editar-produto.js"></script>





</body>

</html>
